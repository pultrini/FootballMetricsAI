[project]
name = "football-analytics"
version = "0.1.0"
description = "Modular computer-vision and football analytics pipeline"
readme = "README.md"
authors = [
    { name = "pultrini", email = "davi.pultrini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnx2torch>=1.5.15",
    "onnxruntime>=1.29.0",
    "opencv-python>=5.0.0.93",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "supervision>=0.30.2",
    "torch>=2.14.0",
    "trackers>=2.6.0",
    "ultralytics>=8.4.143",
]

[project.scripts]
football-analytics = "football_analytics.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
datasets = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "statsbombpy>=1.22.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude=["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.uv.workspace]
members = [
    "baixar_model",
]

[tool.taskipy.tasks]
format = "uv run ruff format ."
lint = "uv run ruff check . --fix"
test = "uv run pytest -v"

check = "task format && task lint && task test"
